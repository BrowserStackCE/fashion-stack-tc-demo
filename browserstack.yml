# BrowserStack Automate config for the FashionStack demo suite.
# Credentials come from env vars (or tc's signed-in session) — never commit keys here.
userName: ${BROWSERSTACK_USERNAME}
accessKey: ${BROWSERSTACK_ACCESS_KEY}

framework: playwright
projectName: FashionStack Demo
buildName: fashionstack-e2e

# Single platform so the feature-branch run shows exactly one failed session for RCA.
platforms:
  - os: Windows
    osVersion: 11
    browserName: chrome
    browserVersion: latest

parallelsPerPlatform: 5

# Tests hit http://localhost:5000 through the Local tunnel
browserstackLocal: true

# Test Reporting & Analytics — powers RCA, failure analysis and test selection
testObservability: true

# Accessibility scans off: the scanner extension breaks page.goto on Windows Chrome
accessibility: false

debug: true
networkLogs: false
consoleLogs: info
